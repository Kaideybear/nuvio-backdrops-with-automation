name: Update Nuvio Backdrops

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pillow requests numpy python-dotenv

    - name: Run Prism Wallpapers Script
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
        MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
      run: |
        chmod +x generate.sh

        ./generate.sh popular curated --folder curated/popular
        ./generate.sh trending curated --folder curated/trending
        ./generate.sh top_rated curated --folder curated/top_rated
        
        ./generate.sh 7899 company --folder company/marvel-studios
        ./generate.sh 429 company --folder company/dc-comics
        ./generate.sh 7 company --folder company/dreamworks
        ./generate.sh 10342 company --folder company/20th-century-fox
        ./generate.sh 420 company --folder company/marvel-entertainment
        ./generate.sh 4859 company --folder company/lionsgate
        ./generate.sh 3 company --folder company/pixar
        ./generate.sh 1 company --folder company/lucasfilm
        ./generate.sh 198847 company --folder company/a24
        
        ./generate.sh 28 genre --folder genre/action
        ./generate.sh 16 genre --folder genre/animation
        ./generate.sh 35 genre --folder genre/comedy
        ./generate.sh 80 genre --folder genre/crime
        ./generate.sh 99 genre --folder genre/documentary
        ./generate.sh 18 genre --folder genre/drama
        ./generate.sh 10762 genre --folder genre/kids
        ./generate.sh 14 genre --folder genre/fantasy
        ./generate.sh 10768-36 genre --folder genre/war-history
        ./generate.sh 27 genre --folder genre/horror
        ./generate.sh 10402 genre --folder genre/music
        ./generate.sh 9648 genre --folder genre/mystery
        ./generate.sh 10764 genre --folder genre/reality
        ./generate.sh 10749 genre --folder genre/romance
        ./generate.sh 53 genre --folder genre/thriller
        ./generate.sh 37 genre --folder genre/western
        
        ./generate.sh 8 provider --folder provider/netflix
        ./generate.sh 337 provider --folder provider/disney-plus
        ./generate.sh 9 provider --folder provider/prime-video
        ./generate.sh 350 provider --folder provider/apple-tv-plus
        ./generate.sh 1899 provider --folder provider/max
        ./generate.sh 15 provider --folder provider/hulu
        ./generate.sh 2303 provider --folder provider/paramount-plus
        ./generate.sh 386 provider --folder provider/peacock
        ./generate.sh 520 provider --folder provider/discovery-plus

        ./generate.sh "rjchignell/best-of-the-1950-s" mdblist score --folder decades/1950
        ./generate.sh "rjchignell/best-of-the-1960-s" mdblist score --folder decades/1960
        ./generate.sh "rjchignell/best-of-the-1970-s" mdblist score --folder decades/1970
        ./generate.sh "rjchignell/best-of-the-1980-s" mdblist score --folder decades/1980
        ./generate.sh "rjchignell/best-of-the-1990-s" mdblist score --folder decades/1990
        ./generate.sh "rjchignell/best-of-the-2010-s" mdblist score --folder decades/2000
        ./generate.sh "rjchignell/best-of-the-2010-s-cbdd0502-c40f-4224-9152-361e0a991a9b" mdblist score --folder decades/2010
        ./generate.sh "snoak/top-2020s-movies" mdblist score --folder decades/2020
        
        ./generate.sh "kaidey/brazilian-trending" mdblist score --folder languages/brazilian
        ./generate.sh "kaidey/chinese-trending" mdblist score --folder languages/chinese
        ./generate.sh "kaidey/german-trending" mdblist score --folder languages/german
        ./generate.sh "kaidey/spanish-trending" mdblist score --folder languages/spanish
        ./generate.sh "kaidey2/french-trending" mdblist score --folder languages/french
        ./generate.sh "kaidey2/indian-trending" mdblist score --folder languages/indian
        ./generate.sh "kaidey2/italian-trending" mdblist score --folder languages/italian
        ./generate.sh "kaidey2/japanese-trending" mdblist score --folder languages/japanese
        ./generate.sh "kaidey3/korean-trending" mdblist score --folder languages/korean
        ./generate.sh "kaidey3/latin-american-trending" mdblist score --folder languages/latin-american
        ./generate.sh "kaidey3/nordic-trending" mdblist score --folder languages/nordic
        ./generate.sh "kaidey3/russian-trending" mdblist score --folder languages/russian
        ./generate.sh "kaidey4/turkish-trending" mdblist score --folder languages/turkish
        
    - name: Clean Python cache folders
      run: |
        find . -type d -name "__pycache__" -prune -exec rm -rf {} +
        
    - name: Commit and Push Changes
      id: publish
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        if git diff --cached --quiet; then
          echo "No changes to commit."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit -m "chore: refresh collection backdrops [skip ci]"
        
        # ── THE FIX: Pull remote changes right before pushing ──
        git pull --rebase origin main
        
        git push
        echo "changed=true" >> "$GITHUB_OUTPUT"
