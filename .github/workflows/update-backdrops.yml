name: Update Nuvio Backdrops

on:
  schedule:
    # Runs at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to trigger the script manually from the Actions tab

# Moved out of 'on:' to the top level
permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # Changed to 1 to speed up cloning

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Fixed invalid key 'python-node-version'
        cache: 'pip' # Enables automatic caching for faster runs

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pillow requests numpy python-dotenv

    - name: Run Prism Wallpapers Script
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
        MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
      run: |
        chmod +x generate.sh
        ./generate.sh --url rjchignell/best-of-the-1950-s
        

    - name: Clean Python cache folders
      run: |
        find . -type d -name "__pycache__" -prune -exec rm -rf {} +
        
    - name: Commit and Push Changes
      id: publish
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        if git diff --cached --quiet; then
          echo "No changes to commit."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit -m "chore: refresh collection backdrops [skip ci]" # Added [skip ci] to prevent loops
        git push
        echo "changed=true" >> "$GITHUB_OUTPUT"
